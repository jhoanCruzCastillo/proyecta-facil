services:
  postgres:
    image: postgres:16
    container_name: proyecta_facil_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: proyecta_facil
      POSTGRES_USER: proyecta_facil
      POSTGRES_PASSWORD: proyecta_facil
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecta_facil -d proyecta_facil"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

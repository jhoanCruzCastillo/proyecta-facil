services:
  mariadb:
    image: mariadb:11
    container_name: proyecta_facil_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: proyecta_facil
      MARIADB_USER: proyecta_facil
      MARIADB_PASSWORD: proyecta_facil
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
